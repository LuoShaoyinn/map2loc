[project]
name = "bev2loc"
version = "0.1.0"
description = "bev2loc: procedural trajectories and corrupted BEV observations"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "opencv-python",
    "torch",
]

[project.optional-dependencies]
cuda = ["torch", "triton"]
metal = ["torch"]
rocm = ["torch", "triton"]

[project.scripts]
bev2loc-preview = "bev2loc.visualize:main"
bev2loc-train = "bev2loc.train:main"
bev2loc-evaluate = "bev2loc.evaluate:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
conflicts = [
    [{ extra = "cuda" }, { extra = "rocm" }],
    [{ extra = "metal" }, { extra = "rocm" }],
    [{ extra = "metal" }, { extra = "cuda" }],
]

[tool.uv.sources]
torch = [
    { index = "rocm724", extra = "rocm" },
    { index = "cuda130", extra = "cuda" },
    { index = "darwin", extra = "metal" },
]
triton = [
    { index = "rocm724", extra = "rocm" },
    { index = "cuda130", extra = "cuda" },
]

[[tool.uv.index]]
name = "cuda130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "darwin"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "rocm724"
url = "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.4/"
format = "flat"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bev2loc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
